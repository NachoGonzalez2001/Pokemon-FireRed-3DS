# Explicit exceptions for tools/release_audit.py. Every entry needs a reason.

[large]
# Files over 1 MiB that are allowed (globs): the release's own executables
# and the room tables the generators write (numbers: metatile ids, heights).
paths = [
    "FireRed3DS-v*-Windows/FireRed3DS-Builder.exe",
    "FireRed3DS-v*-Windows/firered3ds-builder-cli.exe",
    "FireRed3DS-v*-Windows/payload/FireRed3DS.3dsx",
    "3ds_port/src/voxel/voxel_room_table.h",
]

[media]
# Images and binary assets allowed in the repository, with their provenance.
"3ds_port/assets/artwork/icon.png" = "HOME Menu icon: an original pixel-art Poke Ball by the FireRed 3DS author"
"3ds_port/assets/artwork/icon_large.png" = "the same icon at 256x256"
"3ds_port/assets/artwork/banner-sound.wav" = "HOME Menu banner chime, synthesised for this project"

[local_paths]
paths = []

[skip]
globs = []

[runtime]
# The builder's PyInstaller runtime: Python, Tcl/Tk, Pillow and their DLLs,
# shipped unmodified under their own licenses. Checked for ROMs, data packs
# and secrets, not for size or incidental byte runs.
globs = ["FireRed3DS-v*-Windows/_internal/*"]
